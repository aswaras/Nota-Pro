<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nota Pro</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nota Pro">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ai">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#161a2b;--mu:#6b7287;--bd:#e5e8f0;--ac:#4f46e5;--ok:#16a34a;--wr:#e11d48;--sh:0 4px 20px rgba(20,25,60,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--card:#181b30;--tx:#eef0fa;--mu:#9aa0ba;--bd:#272b46;--sh:0 4px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1020;--card:#181b30;--tx:#eef0fa;--mu:#9aa0ba;--bd:#272b46;--sh:0 4px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s}
:root{padding-top:env(safe-area-inset-top,0px)}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.view{display:none;padding:46px 16px 18px;animation:in .3s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:22px 0 10px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--ac),#8b5cf6);color:#fff;border:0}
.hero .big{font-size:30px;font-weight:800;margin:6px 0}.hero .mu{color:#ffffffcc}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}
.big2{font-size:22px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;cursor:pointer}.row .gr{flex:1;min-width:0}
.row b,.row .mu{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);display:grid;place-items:center;font-weight:700}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.b-ok{background:#16a34a22;color:var(--ok)}.b-wr{background:#e11d4822;color:var(--wr)}
.item+.item{border-top:1px solid var(--bd);margin-top:12px;padding-top:12px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px;outline:0;transition:.2s}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:.7fr 1.3fr .8fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--ac);color:#fff;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}.btn.sec{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}.btn.dg{background:#e11d4818;color:var(--wr)}.btn.full{width:100%}
.bar{display:flex;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-size:13px;font-weight:600;color:var(--mu);cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 45%,transparent);width:calc(100% - 32px);max-width:528px;padding:14px;border-radius:14px;display:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
nav div{display:flex;width:100%;max-width:520px;background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:6px}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0;border-radius:16px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:.25s}
nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px}nav button.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.sum div{display:flex;justify-content:space-between;padding:5px 0}.sum .t{font-weight:800;font-size:17px;border-top:1px dashed var(--bd);margin-top:6px;padding-top:10px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top h1{flex:1;margin:0}
.sw{display:flex;gap:10px}.sw i{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--tx)}
.tg{display:flex;justify-content:space-between;align-items:center}
.pv{overflow:hidden;border-radius:14px;box-shadow:var(--sh)}
.sheet{width:600px;background:#fff;color:#1b1f33;font-family:Inter,system-ui,sans-serif;font-size:13px;transform-origin:top left}
.sheet .hd{padding:28px 32px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start}
.sheet .hd h2{margin:0;font-size:22px;color:#fff}.sheet .hd p{margin:4px 0 0;opacity:.85;font-size:12px;max-width:260px}
.sheet .tt{text-align:right}.sheet .tt b{font-size:18px;letter-spacing:2px}.sheet .tt div{font-size:12px;opacity:.9;margin-top:4px}
.sheet .bd{padding:24px 32px}.sheet .meta{display:flex;justify-content:space-between;margin-bottom:18px}
.sheet small{color:#7b8199;font-size:10px;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px}
.sheet table{width:100%;border-collapse:collapse}.sheet th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#7b8199;padding:8px 6px;border-bottom:2px solid #e8eaf2}
.sheet td{padding:10px 6px;border-bottom:1px solid #eef0f6;vertical-align:top}.sheet .r{text-align:right}
.sheet .tot{margin:16px 0 0 auto;width:250px}.sheet .tot div{display:flex;justify-content:space-between;padding:4px 0}
.sheet .tot .g{font-weight:800;font-size:15px;padding:10px 12px;border-radius:10px;margin-top:6px;color:#fff}
.sheet .ft{padding:16px 32px 26px;background:#f6f7fb;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.sheet .stp{display:inline-block;border:4px double;border-radius:10px;padding:4px 20px;font-size:28px;font-weight:800;transform:rotate(-8deg);letter-spacing:4px;opacity:.85;margin:6px 0 16px 6px}
.modal{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end;justify-content:center;animation:in .2s}.mb{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.pill{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:50;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;box-shadow:var(--sh);cursor:pointer}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--ok);transition:background .3s}.pill.y i{background:#f59e0b;animation:pl 1s infinite}.pill.r i{background:var(--wr)}
@keyframes pl{50%{transform:scale(1.5);opacity:.5}}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-80px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:99;transition:.35s}.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="home" class="view on"></div>
<div id="list" class="view"></div>
<div id="form" class="view"></div>
<div id="prev" class="view"></div>
<div id="bel" class="view"></div>
<div id="set" class="view"></div>
<button class="btn fab" id="fab" onclick="newForm()">＋ Buat Nota</button>
<nav><div id="nav"></div></nav>
<div class="toast" id="toast"></div>
<div class="pill g" id="st" onclick="pull(1)"><i></i><span id="stt">Online</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const K='notapro_v1';
const DEF={api:'',biz:'Usaha Saya',title:'NOTA PESANAN',addr:'Alamat usaha Anda',bank:'BCA 1234567890 a.n. Nama Anda',thanks:'Terima kasih atas kepercayaan Anda!',theme:'auto',ac:'#4f46e5'};
let S={set:{...DEF},notes:[],exps:[],arcs:[],q:[],synced:0};
try{const x=JSON.parse(localStorage.getItem(K));if(x){S.set={...DEF,...x.set};S.notes=x.notes||[];S.exps=x.exps||[];S.arcs=x.arcs||[];S.q=x.q||[];S.synced=x.synced||0}}catch(e){}
let pt,lastSet=JSON.stringify({...S.set,api:''});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}const cs=JSON.stringify({...S.set,api:''});if(cs!==lastSet){lastSet=cs;clearTimeout(pt);pt=setTimeout(()=>{S.q=S.q.filter(o=>o.a!=='set');S.q.push({a:'set',set:{...S.set,api:undefined}});save();flush()},1500)}};
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const fd=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const calc=n=>{const sub=n.items.reduce((a,i)=>a+i.q*i.p*(1-(i.dc||0)/100),0);const paid=(n.pays||[]).reduce((a,p)=>a+p.a,0);return{sub,paid,sisa:Math.max(0,sub-(n.dp||0)-paid)}};
const nf=el=>{const v=+el.value.replace(/\D/g,'');el.value=v?v.toLocaleString('id-ID'):'';return v};
const fv=v=>v?Number(v).toLocaleString('id-ID'):'';
const byD=(a,b)=>(b.date||'').localeCompare(a.date||'');
const qty=n=>n.items.reduce((a,i)=>a+(+i.q||0),0);
let cur='home',editing=null,draft=null,viewing=null,flt='all',q='';

function theme(){const s=S.set,r=document.documentElement;s.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',s.theme);r.style.setProperty('--ac',s.ac)}
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',list:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',bel:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2.5l2.2 10.5a1 1 0 001 .8h8.6a1 1 0 001-.8L20 8H6.2"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'};
function nav(){$('#nav').innerHTML=[['home','Home'],['list','Nota'],['bel','Belanja'],['set','Setting']].map(([k,l])=>`<button class="${cur===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${l}</button>`).join('')}
function go(v){cur=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));$('#fab').style.display=v==='list'?'block':'none';
 document.querySelector('nav').style.display=(v==='form'||v==='prev')?'none':'flex';nav();({home:rHome,list:rList,bel:rBel,set:rSet})[v]?.();scrollTo(0,0)}

function row(n){const c=calc(n);return`<div class="card row" onclick="openPrev('${n.id}')"><div class="av">${e((n.name||'?')[0].toUpperCase())}</div><div class="gr"><b>${e(n.name)}</b><span class="mu">${e(n.no)} · ${fd(n.date)}${n.arc?' · 🗂️ Arsip':''}</span></div><div style="text-align:right"><b>${rp(c.sub)}</b><span class="badge ${c.sisa?'b-wr':'b-ok'}">${c.sisa?'Belum Lunas':'Lunas'}</span></div></div>`}
function per(){const N=S.notes.filter(n=>!n.arc),X=S.exps.filter(x=>!x.arc),cs=N.map(calc),omset=cs.reduce((a,c)=>a+c.sub,0),bel=X.reduce((a,x)=>a+(+x.amt||0),0);
 return{N,X,omset,bel,untung:omset-bel,qt:N.reduce((a,n)=>a+qty(n),0),tag:cs.reduce((a,c)=>a+c.sisa,0)}}
function rHome(){const p=per(),u=p.untung;
 $('#home').innerHTML=`<div class="mu">Halo 👋</div><h1>${e(S.set.biz)}</h1>
 <div class="card hero" style="margin-top:14px"><div class="mu">Total Penjualan / Omset</div><div class="big">${rp(p.omset)}</div><div class="mu">${p.N.length} nota · ${p.X.length} belanja${S.arcs.length?' · sejak '+fd(S.arcs[0].date):''}</div></div>
 <div class="grid"><div class="card"><div class="mu">Total Belanja</div><div class="big2" style="color:var(--wr)">${rp(p.bel)}</div></div><div class="card"><div class="mu">${u<0?'Kerugian':'Keuntungan'}</div><div class="big2" style="color:${u<0?'var(--wr)':'var(--ok)'}">${rp(Math.abs(u))}</div></div></div>
 <div class="grid" style="margin-top:12px"><div class="card"><div class="mu">Jumlah Qty Pesanan</div><div class="big2">${p.qt}</div></div><div class="card"><div class="mu">Sisa Tagihan</div><div class="big2" style="color:var(--wr)">${rp(p.tag)}</div></div></div>
 <h2>5 Nota Terbaru</h2>${p.N.length?p.N.slice(0,5).map(row).join(''):'<div class="empty">Belum ada nota di periode ini.<br>Buka menu Nota untuk membuat.</div>'}
 ${S.arcs.length?`<h2>Riwayat Arsip</h2>${S.arcs.map(a=>`<div class="card row" onclick="arcView('${a.id}')"><div class="av">🗂️</div><div class="gr"><b>${e(a.label)}</b><span class="mu">${fd(a.date)} · ${a.nota} nota · ${a.exp} belanja</span></div><div style="text-align:right"><b style="color:${a.untung<0?'var(--wr)':'var(--ok)'}">${rp(a.untung)}</b><span class="mu">Untung</span></div></div>`).join('')}`:''}`}
function arcOpen(){const p=per();if(!p.N.length&&!p.X.length)return toast('Belum ada data di periode ini');
 const m=document.createElement('div');m.id='am';m.className='modal';
 m.innerHTML=`<div class="mb"><b style="font-size:17px">Arsipkan Periode Ini</b><div class="mu" style="margin-top:4px">Angka di Home kembali dari nol. Semua data nota &amp; belanja tetap tersimpan. Nota yang belum lunas tetap bisa ditagih di menu Nota.</div>
 <div class="card sum" style="margin:14px 0 0;box-shadow:none;background:var(--bg)"><div><span>Omset</span><b>${rp(p.omset)}</b></div><div><span>Belanja</span><b>${rp(p.bel)}</b></div><div><span>Keuntungan</span><b>${rp(p.untung)}</b></div><div><span>Qty</span><b>${p.qt}</b></div><div><span>Sisa Tagihan</span><b>${rp(p.tag)}</b></div></div>
 <label>Nama arsip</label><input id="al" value="Periode ${fd(new Date())}">
 <div class="g2" style="margin-top:14px"><button class="btn sec" onclick="$('#am').remove()">Batal</button><button class="btn" onclick="arcDo()">🗂️ Arsipkan</button></div></div>`;
 m.onclick=ev=>{if(ev.target===m)m.remove()};document.body.appendChild(m)}
function arcDo(){const p=per();if(!p.N.length&&!p.X.length){$('#am')?.remove();return}
 const id='A'+Date.now(),a={id,date:new Date().toISOString(),label:($('#al').value||'').trim()||'Periode '+fd(new Date()),nota:p.N.length,exp:p.X.length,qty:p.qt,omset:p.omset,bel:p.bel,untung:p.untung,tag:p.tag};
 p.N.forEach(n=>n.arc=id);p.X.forEach(x=>x.arc=id);S.arcs.unshift(a);save();
 push({a:'arc',arc:a,nids:p.N.map(n=>n.id),eids:p.X.map(x=>x.id)});$('#am').remove();toast('Periode diarsipkan ✓');cur==='set'?rSet():rHome()}
function arcView(id){const a=S.arcs.find(x=>x.id===id);if(!a)return;const m=document.createElement('div');m.id='am';m.className='modal';
 m.innerHTML=`<div class="mb"><b style="font-size:17px">${e(a.label)}</b><div class="mu">Diarsipkan ${fd(a.date)}</div>
 <div class="card sum" style="margin:14px 0 0;box-shadow:none;background:var(--bg)"><div><span>Jumlah Nota</span><b>${a.nota}</b></div><div><span>Qty</span><b>${a.qty}</b></div><div><span>Omset</span><b>${rp(a.omset)}</b></div><div><span>Belanja</span><b>${rp(a.bel)}</b></div><div><span>Keuntungan</span><b style="color:${a.untung<0?'var(--wr)':'var(--ok)'}">${rp(a.untung)}</b></div><div><span>Sisa Tagihan (saat diarsipkan)</span><b>${rp(a.tag)}</b></div></div>
 <div class="g2" style="margin-top:14px"><button class="btn sec" onclick="$('#am').remove()">Tutup</button><button class="btn dg" onclick="arcRestore('${a.id}')">↩️ Buka Kembali</button></div></div>`;
 m.onclick=ev=>{if(ev.target===m)m.remove()};document.body.appendChild(m)}
function arcRestore(id){if(!confirm('Buka kembali arsip ini? Nota & belanja di dalamnya akan masuk lagi ke hitungan Home.'))return;
 S.notes.forEach(n=>{if(n.arc===id)delete n.arc});S.exps.forEach(x=>{if(x.arc===id)delete x.arc});S.arcs=S.arcs.filter(a=>a.id!==id);save();push({a:'unarc',id});$('#am')?.remove();toast('Arsip dibuka kembali ✓');rHome()}

function rList(){let a=S.notes.filter(n=>{const c=calc(n),t=(n.name+n.no+(n.wa||'')).toLowerCase();if(q&&!t.includes(q.toLowerCase()))return false;
 if(flt==='lunas')return !c.sisa;if(flt==='belum')return c.sisa>0;if(flt==='dl'){if(!n.deadline||!c.sisa)return false;return (new Date(n.deadline)-Date.now())/864e5<=3}return true});
 $('#list').innerHTML=`<h1>Daftar Nota</h1><div class="mu" style="margin-bottom:12px">${S.notes.length} nota</div>
 <input id="sq" placeholder="🔍 Cari nama, nomor nota, WA..." value="${e(q)}" oninput="q=this.value;lst()">
 <div class="chips" style="margin-top:10px">${[['all','Semua'],['belum','Belum Lunas'],['lunas','Lunas'],['dl','Deadline ≤3 hari'],['arsip','Arsip']].map(([k,l])=>`<div class="chip ${flt===k?'on':''}" onclick="flt='${k}';rList()">${l}</div>`).join('')}</div><div id="ls"></div><div style="height:70px"></div>`;lst(a)}
function lst(){const a=S.notes.filter(n=>{const c=calc(n),t=(n.name+n.no+(n.wa||'')).toLowerCase();if(q&&!t.includes(q.toLowerCase()))return false;if(flt==='lunas')return !c.sisa;if(flt==='belum')return c.sisa>0;if(flt==='arsip')return !!n.arc;if(flt==='dl')return n.deadline&&c.sisa&&(new Date(n.deadline)-Date.now())/864e5<=3;return true});
 $('#ls').innerHTML=a.length?a.map(row).join(''):'<div class="empty">Tidak ada nota ditemukan</div>'}

function itemHTML(i,k){return`<div class="card item-card" style="box-shadow:none;background:var(--bg)"><div class="tg"><b>Item ${k+1}</b>${draft.items.length>1?`<button class="btn dg" style="padding:5px 12px" onclick="delItem(${k})">Hapus</button>`:''}</div>
 <label>Name</label><input value="${e(i.n)}" placeholder="Masukkan Pesanan" oninput="draft.items[${k}].n=this.value">
 <label>Description</label><input value="${e(i.d)}" placeholder="Masukkan deskripsi" oninput="draft.items[${k}].d=this.value">
 <div class="g3"><div><label>Qty</label><input type="number" inputmode="numeric" min="0" value="${i.q}" oninput="draft.items[${k}].q=+this.value;sum()"></div>
 <div><label>Harga</label><input type="text" inputmode="numeric" value="${fv(i.p)}" placeholder="0" oninput="draft.items[${k}].p=nf(this);sum()"></div>
 <div><label>Diskon %</label><input type="number" inputmode="decimal" min="0" max="100" value="${i.dc||''}" placeholder="0" oninput="draft.items[${k}].dc=+this.value;sum()"></div></div></div>`}
function newForm(n){editing=n?n.id:null;draft=n?JSON.parse(JSON.stringify(n)):{name:'',wa:'',deadline:'',items:[{n:'',d:'',q:1,p:0,dc:0}],dp:0};rForm();go2('form')}
